name: CI

# This workflow is triggered on pull requests and pushes to the main branch
on:
  pull_request:
  push:
    branches: [main]

# Permissions required for the workflow
permissions:
  contents: read

jobs:
  # Job to scan Ruby code for common Rails security vulnerabilities
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman for static analysis
        run: bin/brakeman --no-pager

  # Job to scan JavaScript dependencies for security vulnerabilities
  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Importmap audit
        run: bin/importmap audit

  # Job to lint Ruby code for consistent style
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop for linting
        run: bin/rubocop -f github

  # Job to run tests for the application
  test:
    runs-on: ubuntu-latest

    # Services required for the test job
    services:
      postgres:
        # Use a Postgres image with PostGIS installed so migrations can enable the extension
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Optional: explicitly create default db so health check succeeds sooner
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # Redis service is commented out but can be enabled if needed
      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files in script directory
        run: ls -l script

      - name: Make script executable
        run: chmod +x script/install_dependencies_to_github_actions.sh

      - name: Install system dependencies
        run: script/install_dependencies_to_github_actions.sh

      - name: Set up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bundle exec rails db:prepare
          # Sanity check PostGIS extension is usable
          psql postgres://postgres:postgres@localhost:5432/postgres -c "SELECT PostGIS_Version();" || true
          bundle exec rails test

      - name: Upload screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: "Diagnostic: show coverage files (for Codecov debugging)"
        if: ${{ always() }}
        run: |
          echo "Coverage dir listing:"
          ls -la coverage || true
          echo "Resultset JSON (first 200 lines):"
          head -n 200 coverage/.resultset.json || true

      - name: "Diagnostic: which coverage files will be uploaded"
        if: ${{ always() }}
        run: |
          echo "Coverage files to upload:"
          # include the hidden .resultset.json explicitly because globbing
          # patterns like coverage/*.resultset.json do not match dotfiles
          ls -la coverage/.resultset.json coverage/*.resultset.json coverage/coverage.xml || true
          echo "Coverage XML (first 50 lines):"
          head -n 50 coverage/coverage.xml || true

      - name: "Merge SimpleCov resultsets and regenerate cobertura XML"
        if: ${{ always() }}
        run: |
          echo "Found resultset files:"
          ls -la coverage/.resultset* || true
          # Run under Bundler so gems from the Gemfile are available. If SimpleCov
          # isn't present for any reason, print a message and continue (don't fail).
          bundle exec ruby -e "begin
            require 'simplecov'
            require 'simplecov-cobertura'
            SimpleCov.root(File.expand_path('.', Dir.pwd))
            resultsets = Dir['coverage/.resultset*json']
            puts 'Collating: ' + resultsets.join(', ')
            if resultsets.empty?
              puts 'No resultset files to collate'
              exit 0
            end
            SimpleCov.collate(resultsets, 'rails') do
              SimpleCov.formatter = SimpleCov::Formatter::MultiFormatter.new([
                SimpleCov::Formatter::HTMLFormatter,
                SimpleCov::Formatter::CoberturaFormatter
              ])
            end
          rescue LoadError => e
            puts "SimpleCov not available: #{e.message}"
            exit 0
          rescue => e
            puts "SimpleCov collate failed: #{e.class}: #{e.message}"
            puts e.backtrace.join("\n")
            exit 0
          end"
          echo "Re-generated coverage/coverage.xml head:"
          head -n 50 coverage/coverage.xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Upload the Cobertura XML and any SimpleCov resultset files so Codecov
          # receives a stable coverage report even when tests run in parallel.
          files: |
            coverage/coverage.xml
            coverage/.resultset.json
            coverage/*.resultset.json
          flags: unit-tests
          verbose: true
